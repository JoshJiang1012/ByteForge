name: Repair ByteForge 7.0 Chunk 029

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-byteforge-7-chunk29.yml'

permissions:
  contents: write
  issues: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch issue transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/1/comments?per_page=100" --paginate --slurp > /tmp/comments.json

      - name: Recover exact 18,000-character chunk 029
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path

          want = '8de266f4ccfc13b5754ee46be7ef88c4888a9ca277f5afe92ad2c5c99f477c9a'
          pages = json.loads(Path('/tmp/comments.json').read_text())
          comments = [x for page in pages for x in page] if pages and isinstance(pages[0], list) else pages
          rx = re.compile(r'BF7ZIP\s+029/030\r?\n([A-Za-z0-9+/=]+)')
          candidates = []
          for item in comments:
              for m in rx.finditer(item.get('body') or ''):
                  data = m.group(1).strip()
                  if data not in candidates:
                      candidates.append(data)

          exact = None
          source = None
          offset = None
          for pos, data in enumerate(candidates, 1):
              if len(data) < 18000:
                  continue
              for start in range(len(data) - 18000 + 1):
                  window = data[start:start+18000]
                  if hashlib.sha256(window.encode('ascii')).hexdigest() == want:
                      exact, source, offset = window, pos, start
                      break
              if exact:
                  break

          if exact is None:
              raise SystemExit('No exact SHA-matching 18,000-character window found for chunk 029')

          Path('/tmp/chunk029.txt').write_text(exact)
          Path('/tmp/comment029.txt').write_text('BF7ZIP 029/030\n' + exact)
          print(f'Recovered exact chunk 029 from candidate {source}, offset {offset}, sha={want}')
          PY

      - name: Post repaired chunk and retrigger exact publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/comment029.txt
          printf '\n# retrigger after SHA-recovered chunk 029\n' >> .github/workflows/publish-byteforge-7-exact.yml
          git config user.name 'ByteForge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/publish-byteforge-7-exact.yml
          git commit -m 'release: retrigger exact ByteForge 7.0 publisher after chunk 029 repair'
          git push origin main
