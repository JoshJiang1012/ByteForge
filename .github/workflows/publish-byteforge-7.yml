name: Publish ByteForge 7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-byteforge-7.yml'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct exact verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/1/comments?per_page=100" > /tmp/comments.json
          python - <<'PY'
          import base64, hashlib, itertools, json, re, zipfile
          from pathlib import Path, PurePosixPath

          EXPECTED = '74996506a25dae0ba608e48317711ff23617f5aa3c4b68d032d03be89091982b'
          comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
          candidates = {i: [] for i in range(1, 31)}
          rx = re.compile(r'BF7ZIP\s+(\d{3})/030\r?\n([A-Za-z0-9+/=]+)')
          for item in comments:
              for m in rx.finditer(item.get('body') or ''):
                  i = int(m.group(1))
                  s = m.group(2).strip()
                  if 1 <= i <= 30 and s not in candidates[i]:
                      candidates[i].append(s)

          for i in (14, 20):
              p = Path(f'BF7_FILL_{i:03d}.txt')
              if p.is_file():
                  s = p.read_text(encoding='utf-8').strip()
                  if s and s not in candidates[i]:
                      candidates[i].append(s)

          missing = [i for i in range(1,31) if not candidates[i]]
          if missing:
              raise SystemExit(f'missing chunks: {missing}')

          conflicts = [i for i in range(1,31) if len(candidates[i]) > 1]
          base = {i: candidates[i][-1] for i in range(1,31)}
          options = [list(reversed(candidates[i])) for i in conflicts]
          raw = None
          attempts = 0
          for combo in itertools.product(*options) if conflicts else [()]:
              attempts += 1
              chosen = dict(base)
              chosen.update(zip(conflicts, combo))
              try:
                  probe = base64.b64decode(''.join(chosen[i] for i in range(1,31)), validate=True)
              except Exception:
                  continue
              if hashlib.sha256(probe).hexdigest() == EXPECTED:
                  raw = probe
                  break
          if raw is None:
              raise SystemExit(f'exact ZIP not found after {attempts} combinations')

          out = Path('/tmp/byteforge-v7.0.zip')
          out.write_bytes(raw)
          with zipfile.ZipFile(out) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'ZIP CRC failure: {bad}')
              names = z.namelist()
              roots = {PurePosixPath(n).parts[0] for n in names if PurePosixPath(n).parts}
              if roots != {'byteforge-v7.0'}:
                  raise SystemExit(f'bad ZIP roots: {roots}')
              if z.read('byteforge-v7.0/VERSION').decode().strip() != '7.0.0':
                  raise SystemExit('VERSION is not 7.0.0')
              z.extractall('/tmp/bf7')
          print(f'VERIFIED {EXPECTED} bytes={len(raw)} attempts={attempts}')
          PY

      - name: Validate candidate before touching main
        working-directory: /tmp/bf7/byteforge-v7.0
        run: |
          set -euxo pipefail
          python server.py --self-test
          python -m py_compile server.py content/quests.py content/reference_solutions.py
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"
          test -s content/quests_data.json.gz
          test -s content/solutions_data.json.gz
          test -s static/styles.css
          test -s static/assets/characters/lyra-stage.webp
          grep -q "BYTEFORGE v7.0" RUN-BYTEFORGE-WINDOWS.bat
          ! grep -q "BYTEFORGE v5.0" RUN-BYTEFORGE-WINDOWS.bat

      - name: Replace application tree while preserving workflow refs
        run: |
          set -euxo pipefail
          rm -rf /tmp/keep-workflows
          mkdir -p /tmp/keep-workflows
          if [ -d .github/workflows ]; then cp -a .github/workflows/. /tmp/keep-workflows/; fi
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/bf7/byteforge-v7.0/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/keep-workflows/. .github/workflows/
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Final validation
        run: |
          set -euxo pipefail
          python server.py --self-test
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'ERROR: workflow files changed; refusing token push'
            git diff --cached --name-status
            exit 1
          fi
          git diff --cached --name-status

      - name: Commit verified ByteForge 7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          git config user.name 'ByteForge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Release ByteForge 7.0 — AI Academy (verified Windows package)'
          if ! git push origin main 2>&1 | tee /tmp/push.log; then
            gh issue comment 1 --repo "${{ github.repository }}" --body "ByteForge 7.0 package validation passed, but git push failed:\n\n\`\`\`\n$(cat /tmp/push.log)\n\`\`\`" || true
            exit 1
          fi
          gh issue close 1 --repo "${{ github.repository }}" --comment 'ByteForge 7.0 exact ZIP was SHA-256 verified, validated (100/100 self-test), and published to main.' || true
