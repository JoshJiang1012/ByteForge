name: Publish ByteForge 7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-byteforge-7.yml'

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact BF7ZIP transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/1/comments?per_page=100" > /tmp/comments.json

      - name: Reconstruct and validate release ZIP
        run: |
          python - <<'PY'
          import base64, hashlib, itertools, json, re, sys, zipfile
          from io import BytesIO
          from pathlib import Path, PurePosixPath

          diag = Path('/tmp/bf7-diagnostics.txt')
          try:
              comments = json.loads(Path('/tmp/comments.json').read_text(encoding='utf-8'))
              candidates = {i: [] for i in range(1, 31)}
              rx = re.compile(r'BF7ZIP\s+(\d{3})/030\r?\n([A-Za-z0-9+/=]+)')
              for item in comments:
                  body = item.get('body') or ''
                  for m in rx.finditer(body):
                      idx = int(m.group(1))
                      if not 1 <= idx <= 30:
                          continue
                      data = m.group(2).strip()
                      if data not in candidates[idx]:
                          candidates[idx].append(data)

              missing = [i for i, values in candidates.items() if not values]
              if missing:
                  raise RuntimeError('missing BF7ZIP chunks: ' + ', '.join(f'{i:03d}' for i in missing))

              conflicts = {i: len(v) for i, v in candidates.items() if len(v) > 1}
              variants = 1
              for count in conflicts.values():
                  variants *= count
              if variants > 4096:
                  raise RuntimeError(f'too many conflicting transport combinations: {variants}')

              # Newest comment candidate first. We never trust ordering alone: every
              # candidate combination must pass ZIP CRC + ByteForge 7.0 structure.
              option_lists = [list(reversed(candidates[i])) for i in range(1, 31)]

              required = {
                  'byteforge-v7.0/VERSION',
                  'byteforge-v7.0/server.py',
                  'byteforge-v7.0/RUN-BYTEFORGE-WINDOWS.bat',
                  'byteforge-v7.0/content/quests_data.json.gz',
                  'byteforge-v7.0/static/index.html',
                  'byteforge-v7.0/static/app.js',
                  'byteforge-v7.0/static/styles.css',
                  'byteforge-v7.0/static/assets/characters/lyra-stage.webp',
                  'byteforge-v7.0/static/assets/characters/patch-stage.webp',
                  'byteforge-v7.0/static/assets/characters/patch-thumb.webp',
                  'byteforge-v7.0/static/assets/characters/warden-stage.webp',
              }

              def validate_raw(raw: bytes):
                  if not (200_000 <= len(raw) <= 2_000_000):
                      raise RuntimeError(f'unexpected ZIP size: {len(raw)}')
                  with zipfile.ZipFile(BytesIO(raw)) as z:
                      bad = z.testzip()
                      if bad:
                          raise RuntimeError(f'ZIP CRC failure: {bad}')
                      names = z.namelist()
                      for name in names:
                          p = PurePosixPath(name)
                          if p.is_absolute() or '..' in p.parts:
                              raise RuntimeError(f'unsafe ZIP path: {name}')
                      roots = {PurePosixPath(n).parts[0] for n in names if PurePosixPath(n).parts}
                      if roots != {'byteforge-v7.0'}:
                          raise RuntimeError(f'unexpected ZIP root(s): {sorted(roots)}')
                      absent = sorted(required - set(names))
                      if absent:
                          raise RuntimeError('ZIP missing required files: ' + ', '.join(absent))
                      version = z.read('byteforge-v7.0/VERSION').decode('utf-8').strip()
                      server = z.read('byteforge-v7.0/server.py').decode('utf-8')
                      launcher = z.read('byteforge-v7.0/RUN-BYTEFORGE-WINDOWS.bat').decode('utf-8')
                      index = z.read('byteforge-v7.0/static/index.html').decode('utf-8')
                      if version != '7.0.0':
                          raise RuntimeError(f'ZIP VERSION is {version!r}')
                      if 'VERSION = "7.0.0"' not in server or 'AI ACADEMY' not in server:
                          raise RuntimeError('server.py is not the 7.0 AI Academy runtime')
                      if '7.0' not in launcher or '5.0' in launcher:
                          raise RuntimeError('Windows launcher has the wrong version banner')
                      if 'ByteForge 7.0' not in index:
                          raise RuntimeError('static/index.html is not the 7.0 UI')

              # Avoid a full 30-dimensional product: only conflicting indices vary.
              conflict_ids = sorted(conflicts)
              base = {i: option_lists[i - 1][0] for i in range(1, 31)}
              conflict_options = [option_lists[i - 1] for i in conflict_ids]
              attempts = 0
              failures = []
              selected_raw = None
              selected_choice = None

              for combo in itertools.product(*conflict_options) if conflict_ids else [()]:
                  attempts += 1
                  chosen = dict(base)
                  for idx, value in zip(conflict_ids, combo):
                      chosen[idx] = value
                  try:
                      encoded = ''.join(chosen[i] for i in range(1, 31))
                      raw = base64.b64decode(encoded, validate=True)
                      validate_raw(raw)
                      selected_raw = raw
                      selected_choice = {idx: candidates[idx].index(chosen[idx]) + 1 for idx in conflict_ids}
                      break
                  except Exception as exc:
                      failures.append(f'{type(exc).__name__}: {exc}')

              if selected_raw is None:
                  tail = '; '.join(failures[-5:])
                  raise RuntimeError(f'no valid 7.0 ZIP among {attempts} transport combinations; last errors: {tail}')

              digest = hashlib.sha256(selected_raw).hexdigest()
              zip_path = Path('/tmp/byteforge-v7.0.zip')
              zip_path.write_bytes(selected_raw)
              diag.write_text(
                  'ByteForge 7.0 transport verified.\n'
                  f'SHA-256: {digest}\nBytes: {len(selected_raw)}\nChunks: 30/30\n'
                  f'Conflicting chunks: {conflicts or "none"}\n'
                  f'Selected conflict candidates: {selected_choice or "none"}\n'
                  f'Combinations tested: {attempts}\n',
                  encoding='utf-8',
              )
              print(diag.read_text())
          except Exception as exc:
              diag.write_text(f'ByteForge 7.0 publish verification failed:\n{type(exc).__name__}: {exc}\n', encoding='utf-8')
              print(diag.read_text(), file=sys.stderr)
              raise
          PY

      - name: Extract candidate package
        run: |
          rm -rf /tmp/bf7
          mkdir -p /tmp/bf7
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/byteforge-v7.0.zip') as z:
              z.extractall('/tmp/bf7')
          PY

      - name: Validate candidate before touching main
        working-directory: /tmp/bf7/byteforge-v7.0
        run: |
          python server.py --self-test
          python -m py_compile server.py content/quests.py content/reference_solutions.py
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"
          test -s content/quests_data.json.gz
          test -s static/styles.css
          test -s static/assets/characters/lyra-stage.webp
          grep -q "BYTEFORGE v7.0" RUN-BYTEFORGE-WINDOWS.bat
          ! grep -q "BYTEFORGE v5.0" RUN-BYTEFORGE-WINDOWS.bat

      - name: Replace repository atomically after validation
        run: |
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/bf7/byteforge-v7.0/. .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Final validation in repository tree
        run: |
          python server.py --self-test
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"

      - name: Commit verified ByteForge 7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'ByteForge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release ByteForge 7.0 — AI Academy (verified Windows package)'
          git push origin main
          gh issue close 1 --repo ${{ github.repository }} --comment 'ByteForge 7.0 was reconstructed from the exact release ZIP, validated (100/100 self-test), and published to main.' || true

      - name: Report safe failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/bf7-diagnostics.txt ]; then
            gh issue comment 1 --repo ${{ github.repository }} --body-file /tmp/bf7-diagnostics.txt || true
          else
            gh issue comment 1 --repo ${{ github.repository }} --body 'ByteForge 7.0 publisher failed after transport verification. Main was not replaced unless candidate validation had already completed.' || true
          fi
