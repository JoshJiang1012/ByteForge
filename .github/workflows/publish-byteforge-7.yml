name: Publish ByteForge 7.0

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == 'PUBLISH_BYTEFORGE_7' &&
      github.actor == 'JoshJiang1012'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch transport chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/1/comments --paginate > /tmp/comments.json

      - name: Reconstruct and verify release ZIP
        env:
          EXPECTED_SHA256: 74996506a25dae0ba608e48317711ff23617f5aa3c4b68d032d03be89091982b
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          parts = {}
          total = None
          rx = re.compile(r'BF7CHUNK (\d+)/(\d+)\n([A-Za-z0-9+/=]+)')
          for item in comments:
              body = item.get('body') or ''
              for m in rx.finditer(body):
                  idx, count = int(m.group(1)), int(m.group(2))
                  total = count if total is None else total
                  if total != count:
                      raise SystemExit('chunk count mismatch')
                  parts[idx] = m.group(3)
          if not total or len(parts) != total or set(parts) != set(range(1, total + 1)):
              raise SystemExit(f'incomplete transport: have {len(parts)}, expected {total}')
          raw = base64.b64decode(''.join(parts[i] for i in range(1, total + 1)), validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          if digest != os.environ['EXPECTED_SHA256']:
              raise SystemExit(f'SHA-256 mismatch: {digest}')
          Path('/tmp/byteforge-v7.0.zip').write_bytes(raw)
          print('verified', digest, len(raw), 'bytes')
          PY

      - name: Replace repository with ByteForge 7.0
        run: |
          rm -rf /tmp/bf7
          mkdir -p /tmp/bf7
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/byteforge-v7.0.zip') as z:
              z.extractall('/tmp/bf7')
          PY
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/bf7/byteforge-v7.0/. .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Validate release
        run: |
          python server.py --self-test
          python -m py_compile server.py content/quests.py content/reference_solutions.py
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"

      - name: Commit ByteForge 7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'ByteForge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release ByteForge 7.0 — AI Academy'
          git push origin main
          gh issue close 1 --repo ${{ github.repository }} --comment 'ByteForge 7.0 published to main and validated by self-test.'
