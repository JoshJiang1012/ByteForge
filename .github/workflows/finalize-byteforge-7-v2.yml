name: Finalize ByteForge 7.0 V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-byteforge-7-v2.yml'

permissions:
  contents: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch transport comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/issues/1/comments?per_page=100" --paginate --slurp > /tmp/comments.json

      - name: Verify all source pieces and reconstruct exact ZIP
        run: |
          python - <<'PY'
          import base64, hashlib, json, re, sys, zipfile
          from io import BytesIO
          from pathlib import Path

          diag = Path('/tmp/bf7-v2.txt')
          hashes = '''
          cf98012a3a4790abe7b1518ad870158d3e6eef4c41093d9c9e670bb56e346772
          02a6705d1426428ea43c55de07393d8aa3a936f8a5373c47398ce9f52db98cd0
          f072f293d7142487184d3754d39c1bd89e7ede948e6ca8ae929593bd3abff475
          b28665079fdeac08f9e820b81e59a048ccbfa1cb9a4dcf0baefaffe86b53e4ff
          ef87068303e92696dcb13e20a06f5c0c72ded9b5df00f444ab74f5bd69424719
          2a487e3f89e239a5255e4dd0bd03b2b235a708dcbba469ae3537e89275b732e5
          01799ff30984deef19ae3722b49fdf297c089dc60b95fcd0a87ed7aa4d6dbec4
          10bbcb214927dec2e8dc01182870c12fd9377d0a1e518aff5f43c713c7248ac0
          647c8d07df58ee8b5054635538a4e190cbcd35b0f4136dd222394ac9cbefe4f9
          e092d716d6a8ebed6b9668687b7b0cb4524ad7fe12747f26837d8fc8086772bb
          7222a4aaa394bc4637ccbcae3cacc1ab4c80c1f8ab10748ff9279f54df072212
          d86962c9e507cc3ad310eca7e79b512e3aa362dc4775750e6eba8818bec95831
          2918bdf28c9b539448c2f61d9880b692588700d97c07e37abf5e695f8bed05af
          f6738ae5e60f8d96bc04a686e11459d29d1a4b443451e92324404e7e6569acde
          8c9e256c93771987aca1485400638eeb6e09c8c1944e89bf0e0321c718a725b3
          82321a614c5396ea36fcdb95d1530dd1c5bec7e262ec4d2203a21ef8bd75c4b6
          c3c6bf2440783579fba66feb5444792386fdb820ff94d8857da7a6f9979d94a6
          8a25bfa3028e090fd39dc8c9be3182d9f391513e0be0b01624e6c89523a3af3e
          4f932e6848fb297015a2095349d2df3c566e420dfd333b9524ca61637b357d53
          d2002bad4c1612cf5db336c319e16c740161500aa6a67cd0ad1a3be05bf50435
          c63258606c5a964044e4b1171a4d98aa7e6c853b09288f625ca52e4e93a733f4
          0544329e8f514a97d4d0bc171156cfcec6736f6f4db12c85ea86554cb238543d
          2448a13964ba993ff1b1eb9d0c18c272eb9babe2f83e53a037149b61066e3b63
          e0105e40053ff58a7b7e7db1a73892790461f1b5c394043aeeb6fa9c2dc53821
          c48ebf838ce5d347990cb866c955f952072a94172d4f0c97d46567c776c92f45
          47884e654d8feb58c633677f0cfed3f23440b275161d5f161bde98e512064cf4
          dafd5930ea348a8d8638576556c62fc4bb294494bf743486634b140389318c75
          545d3c6e399e061f5d774a4ea8288a0ac96a48d8c229a890661250c9a29fbdc9
          8de266f4ccfc13b5754ee46be7ef88c4888a9ca277f5afe92ad2c5c99f477c9a
          13c65104b8e29acde13e528213ed83059b189a014ab3e3572e91b624c6c1683d
          '''.split()
          expected = {i + 1: h for i, h in enumerate(hashes)}
          lengths = {i: 18000 for i in range(1, 30)}
          lengths[30] = 1252
          part_hashes = [
              '7530254b93f6e0f069a7a8ac64f4329a4abe961f56c85d0d70bd3ca7212a6128',
              '34ec0fd8f261cb3b362b87b68245ba08daa3dd0a71dc962238cd421f7b5da78d',
              '70cc67ea43db6eff46b136f602934d0ec5e63e3fb1d6fedd0c8061d12cfb0a68',
              '7fe1bbf64b0ed6eeaa762a9ee41a38cb8e2651f037ffb179f44919a6aa4d651d',
              'ed45d5159d7990f65407dcd02d9b2c0c58b3d8ae0932649f5a07ae54c499e17c',
              '285d54cf460f82b6159bb3b70a11b3335b20c32f8f07c54cfcdc90cfe6d45559',
          ]
          whole = '74996506a25dae0ba608e48317711ff23617f5aa3c4b68d032d03be89091982b'

          try:
              pages = json.loads(Path('/tmp/comments.json').read_text())
              comments = [x for page in pages for x in page] if pages and isinstance(pages[0], list) else pages
              candidates = {i: [] for i in range(1, 31)}
              rx = re.compile(r'BF7ZIP\s+(\d{3})/030\r?\n([A-Za-z0-9+/=]+)')
              for item in comments:
                  for m in rx.finditer(item.get('body') or ''):
                      idx = int(m.group(1))
                      if 1 <= idx <= 30:
                          s = m.group(2).strip()
                          if s not in candidates[idx]:
                              candidates[idx].append(s)

              for idx in (14, 20):
                  p = Path(f'BF7_FILL_{idx:03d}.txt')
                  if p.is_file():
                      s = p.read_text().strip()
                      if s and s not in candidates[idx]:
                          candidates[idx].append(s)

              # Rebuild 029 from six small, individually hashed source files.
              pieces = []
              for n, want in enumerate(part_hashes, 1):
                  p = Path(f'BF7_029_PART_{n:02d}.txt')
                  if not p.is_file():
                      raise RuntimeError(f'missing 029 part {n}')
                  s = p.read_text().strip()
                  got = hashlib.sha256(s.encode('ascii')).hexdigest()
                  if len(s) != 3000 or got != want:
                      raise RuntimeError(f'029 part {n} mismatch len={len(s)} sha={got}')
                  pieces.append(s)
              exact029 = ''.join(pieces)
              got029 = hashlib.sha256(exact029.encode('ascii')).hexdigest()
              if len(exact029) != 18000 or got029 != expected[29]:
                  raise RuntimeError(f'rebuilt 029 mismatch len={len(exact029)} sha={got029}')
              candidates[29].append(exact029)

              selected = {}
              notes = ['029 rebuilt from 6/6 verified 3000-char parts']
              bad = []
              for idx in range(1, 31):
                  match = None
                  match_pos = None
                  for pos, s in enumerate(candidates[idx], 1):
                      if len(s) == lengths[idx] and hashlib.sha256(s.encode('ascii')).hexdigest() == expected[idx]:
                          match, match_pos = s, pos
                  if match is None:
                      seen = ', '.join(f'len={len(s)} sha={hashlib.sha256(s.encode()).hexdigest()[:12]}' for s in candidates[idx]) or 'none'
                      bad.append(f'{idx:03d}: {seen}')
                  else:
                      selected[idx] = match
                      notes.append(f'{idx:03d}: exact candidate {match_pos}')
              if bad:
                  raise RuntimeError('missing exact chunks: ' + ' | '.join(bad))

              encoded = ''.join(selected[i] for i in range(1, 31))
              if len(encoded) != 523252:
                  raise RuntimeError(f'Base64 length mismatch {len(encoded)}')
              raw = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(raw).hexdigest()
              if len(raw) != 392439 or digest != whole:
                  raise RuntimeError(f'ZIP identity mismatch bytes={len(raw)} sha={digest}')
              with zipfile.ZipFile(BytesIO(raw)) as z:
                  bad_file = z.testzip()
                  if bad_file:
                      raise RuntimeError('ZIP CRC failure: ' + bad_file)
              Path('/tmp/byteforge-v7.0.zip').write_bytes(raw)
              diag.write_text('SOURCE VERIFIED\n30/30 exact chunks\n029 parts: 6/6 exact\nZIP bytes: 392439\nZIP SHA-256: ' + digest + '\n' + '\n'.join(notes) + '\n')
              print(diag.read_text())
          except Exception as exc:
              diag.write_text(f'ByteForge 7.0 V2 finalization failed:\n{type(exc).__name__}: {exc}\n')
              print(diag.read_text(), file=sys.stderr)
              raise
          PY

      - name: Extract and run release tests
        run: |
          rm -rf /tmp/bf7 && mkdir -p /tmp/bf7
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/byteforge-v7.0.zip') as z:
              z.extractall('/tmp/bf7')
          PY
          cd /tmp/bf7/byteforge-v7.0
          test "$(cat VERSION)" = "7.0.0"
          python server.py --self-test
          python -m py_compile server.py content/quests.py content/reference_solutions.py
          node --check static/app.js
          test -s content/quests_data.json.gz
          test -s static/styles.css
          test -s static/assets/characters/lyra-stage.webp
          test -s static/assets/characters/patch-stage.webp
          test -s static/assets/characters/patch-thumb.webp
          test -s static/assets/characters/warden-stage.webp
          grep -q "BYTEFORGE v7.0" RUN-BYTEFORGE-WINDOWS.bat
          ! grep -q "BYTEFORGE v5.0" RUN-BYTEFORGE-WINDOWS.bat

      - name: Atomically replace main only after all tests pass
        run: |
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/bf7/byteforge-v7.0/. .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          python server.py --self-test
          node --check static/app.js
          test "$(cat VERSION)" = "7.0.0"

      - name: Publish verified ByteForge 7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'ByteForge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release ByteForge 7.0 — AI Academy (verified 30/30 source)'
          git push origin main
          gh issue close 1 --repo "${{ github.repository }}" --comment 'ByteForge 7.0 published successfully: 30/30 source chunks exact, chunk 029 rebuilt from 6/6 SHA-verified parts, full ZIP SHA-256 exact, and release self-test passed.' || true

      - name: Report safe failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/bf7-v2.txt ]; then
            gh issue comment 1 --repo "${{ github.repository }}" --body-file /tmp/bf7-v2.txt || true
          fi
